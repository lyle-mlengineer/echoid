services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: echoid
      POSTGRES_USER: echoid
      POSTGRES_PASSWORD: echoid
    ports:
      - "5432:5432"
    volumes:
      - echoid-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echoid -d echoid"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  echoid-postgres:

