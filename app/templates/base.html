<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07877c">
  <meta name="description" content="EchoID turns conversations into clear, speaker-labeled transcripts.">
  <title>{% block title %}EchoID — Hear who spoke{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="/" aria-label="EchoID home"><span class="brand-mark">e</span> EchoID</a>
      <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="{% if active_nav == 'home' %}is-active{% endif %}" href="/">Home</a>
        <a href="/#features">Features</a>
        <a href="/#how-it-works">How it works</a>
        <a class="{% if active_nav == 'studio' %}is-active{% endif %}" href="/studio">Studio</a>
        <a class="{% if active_nav == 'plans' %}is-active{% endif %}" href="/billing">Plans</a>
      </nav>
      <div class="nav-actions">
        <a class="nav-login" href="/login">Log in</a>
        <a class="button button-small button-primary nav-cta" href="/register">Get started</a>
      </div>
    </div>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="brand brand-light" href="/"><span class="brand-mark">e</span> EchoID</a>
      <p>Every voice, heard clearly.</p>
      <div class="footer-links"><a href="/#features">Features</a><a href="/studio">Studio</a><a href="/billing">Credits</a></div>
      <span class="footer-copy">© 2026 EchoID</span>
    </div>
  </footer>
  <div class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script>window.ECHOID_FIREBASE = {{ firebase_config|tojson }};</script>
  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
